<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Indoor Air Survey · UbiNet Lab, IIT Kharagpur</title>
  <meta name="description" content="Help researchers at IIT Kharagpur design a wearable assistant you can ask about the air in your home. ~17 minutes, anonymous." />
  <meta name="theme-color" content="#0f8b7d" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230f8b7d'/%3E%3Cpath d='M8 12h11a3 3 0 1 0-3-3M6 17h16a3 3 0 1 1-3 3M9 22h4' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Ambient "air" background -->
  <div class="ambient" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
    <div class="particles" id="particles"></div>
  </div>

  <header class="topbar" id="topbar" hidden>
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 9h11a3 3 0 1 0-3-3M2 14h15a3 3 0 1 1-3 3M5 19h4"/></svg>
        </span>
        <span class="brand-text">Indoor Air Survey</span>
        <span class="sec-now" id="secNow"></span>
      </div>
      <div class="time-left" id="timeLeft"></div>
    </div>
    <div class="steps" id="steps"></div>
    <div class="progress"><span id="progressBar"></span></div>
  </header>

  <main class="wrap" id="app" tabindex="-1"></main>

  <nav class="navbar" id="navbar" hidden>
    <div class="navbar-inner">
      <button class="btn ghost" data-action="back" id="backBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Back
      </button>
      <span class="nav-count" id="navCount"></span>
      <button class="btn primary" data-action="next" id="nextBtn">
        <span>Next</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="https://www.gstatic.com/firebasejs/12.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

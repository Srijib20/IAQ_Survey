name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Write Firebase config from repository secret
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "::error::Repository secret FIREBASE_CONFIG is not set"
            exit 1
          fi
          printf 'window.SURVEY_FIREBASE_CONFIG = %s;\n' "$FIREBASE_CONFIG" > js/firebase-config.js

      - name: Assemble site (only the files respondents need)
        run: |
          mkdir _site
          cp -r index.html css js _site/
          rm -f _site/js/firebase-config.example.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
